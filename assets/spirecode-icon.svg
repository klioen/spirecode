<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">SpireCode</title>
  <desc id="description">Cyan and gold code brackets rise into a spire around an S-shaped path.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12252a"/>
      <stop offset="1" stop-color="#081217"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#16a6c1"/>
      <stop offset="1" stop-color="#35e2f2"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f39a1e"/>
      <stop offset="1" stop-color="#ffd866"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".38"/>
    </filter>
