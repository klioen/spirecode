    <g clip-path="url(#tile)">
      <path d="M492 168 218 378v292l274 190V704L354 610V448l138-104Z" fill="url(#cyan)"/>
      <path d="M532 168 806 378v292L532 860V704l138-94V448L532 344Z" fill="url(#gold)"/>
      <path d="M669 331C590 276 390 291 382 421c-8 126 276 77 269 216-6 116-174 139-301 64" fill="none" stroke="#0b171c" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M655 329C587 292 435 303 409 391" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="12" stroke-linecap="round"/>
    </g>
    <rect x="72" y="60" width="880" height="880" rx="216" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="4"/>
  </g>
</svg>
