<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">SpireCode</title>
  <desc id="description">A single cyan-to-gold S rises on a dark rounded tile.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12252a"/>
      <stop offset="1" stop-color="#081217"/>
    </linearGradient>
    <linearGradient id="spire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35e2f2"/>
      <stop offset=".48" stop-color="#20bfd2"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="70" y="58" width="884" height="884" rx="218" fill="url(#background)"/>
    <path d="M673 267C591 202 363 225 351 402c-11 157 324 94 314 255-10 160-242 180-345 74" fill="none" stroke="url(#spire)" stroke-width="126" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="72" y="60" width="880" height="880" rx="216" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="4"/>
  </g>
</svg>
