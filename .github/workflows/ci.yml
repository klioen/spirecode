name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact_name: spirecode-macos-arm64
            artifact_path: release/*.dmg
          - os: windows-latest
            artifact_name: spirecode-windows-x64
            artifact_path: release/*.exe
          - os: ubuntu-latest
            artifact_name: spirecode-linux-x64
            artifact_path: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.29.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (format, brand, lint, typecheck, tests)
        run: pnpm check

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

      - name: Bundle and smoke native artifact
        run: pnpm bundle

      - name: Upload development artifacts
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
